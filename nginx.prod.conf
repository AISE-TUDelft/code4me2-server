# Production edge for the Code4Me research platform (production-readiness B-07/B-08).
#
# Baked into the website image (src/website/Dockerfile): it serves the built
# React bundle as static files and proxies /api/ to the backend service. TLS is
# terminated in front of this container (a cloud load balancer, Caddy, Traefik or
# the host's nginx); see docs/research-platform/PRODUCTION_DEPLOYMENT.md, which
# also shows how to terminate TLS here instead.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    keepalive_timeout 65;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Re-resolve the backend through Docker's DNS: a recreated backend container
    # gets a new address, and a name resolved once at startup then answers 502
    # until this container restarts. `resolve` needs nginx 1.27.3+ (Dockerfile).
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream backend {
        zone backend 64k;
        server backend:8008 resolve;
        keepalive 32;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Behind an external TLS edge $remote_addr is the edge, not the client.
    # Uncomment and set the edge's address/CIDR so nginx recovers the real
    # client from the edge's X-Forwarded-For before forwarding a single hop:
    # set_real_ip_from 10.0.0.0/8;
    # real_ip_header X-Forwarded-For;
    # real_ip_recursive on;

    server {
        listen 80;
        server_name _;

        # Telemetry batches are up to 1 MB of events plus envelope; 16 MB leaves
        # headroom without letting a client hold a huge body open.
        client_max_body_size 16m;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # Edge liveness for external monitors (no backend dependency).
        # add_header is not inherited into a location that sets its own
        # headers, so the security headers are repeated where needed.
        location = /nginx-health {
            access_log off;
            add_header Content-Type text/plain;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            return 200 'ok';
        }

        # --- API -----------------------------------------------------------
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Exactly ONE hop: the address this proxy saw. The backend trusts
            # the header from this container (FORWARDED_ALLOW_IPS=*) and keys
            # rate limits on it; forwarding the client-supplied chain
            # ($proxy_add_x_forwarded_for) would let a client choose its key.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # Release archive imports (admin only) are large, multi-minute uploads.
        location /api/research/agents/releases/import {
            client_max_body_size 300m;
            proxy_request_buffering off;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
        }

        # Streamed model responses (research inference gateway, ACP relay):
        # never buffer, and allow the backend's 600 s stream budget.
        location ~ ^/api/(research/inference|acp|agent/inference)(/|$) {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
        }

        # WebSocket completion/chat endpoints.
        location /api/ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # --- Website (static React build) -----------------------------------
        root /usr/share/nginx/html;

        location /static/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            try_files $uri =404;
        }

        location = /index.html {
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
        }

        location / {
            try_files $uri /index.html;
        }
    }
}
