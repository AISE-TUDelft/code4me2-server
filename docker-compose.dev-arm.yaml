# Development stack for macOS ARM64 (Apple Silicon) and other non-NVIDIA hosts.
#
# This is the compose file the code's own setup docs reference
# (code4me2_agent/cli.py: "docker compose -f docker-compose.dev-arm.yaml up")
# but which was never added to the repo. It mirrors the production
# docker-compose.yml except:
#
#   * backend / celery-worker build from Dockerfile.arm (CPU-only, linux/arm64)
#   * no NVIDIA GPU reservations, no CUDA/NVML environment or volume mounts
#   * no `huggingface-cli login --token $HF_TOKEN` gate in the entrypoint
#   * service names, ports, env wiring and mount points are unchanged, so the
#     rest of the stack (nginx, website, migrations, agent subsystem) is
#     identical to production.
#
# Usage:
#   docker compose -f docker-compose.dev-arm.yaml up -d
#   docker compose -f docker-compose.dev-arm.yaml exec backend \
#     python src/database/migration/migration_manager.py migrate

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: postgres
    ports:
      - ${DB_PORT}:${DB_PORT}
    expose:
      - ${DB_PORT}
    volumes:
      - .:/app
      - ./src/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_NAME}
      - PGPORT=${DB_PORT}
    command: ["postgres", "-p", "${DB_PORT}"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -p ${DB_PORT}"]
      start_period: 0s
      start_interval: 0s
      interval: 60s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.0
    container_name: redis
    ports:
      - ${REDIS_PORT}:${REDIS_PORT}
    expose:
      - ${REDIS_PORT}
    volumes:
      - .:/app
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--port", "${REDIS_PORT}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "${REDIS_PORT}", "ping"]
      start_period: 0s
      start_interval: 0s
      interval: 60s
      timeout: 5s
      retries: 3

  redis-celery:
    image: redis:7.0
    container_name: redis-celery
    ports:
      - ${CELERY_BROKER_PORT}:${CELERY_BROKER_PORT}
    expose:
      - ${CELERY_BROKER_PORT}
    command: ["redis-server", "--port", "${CELERY_BROKER_PORT}"]
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "${CELERY_BROKER_PORT}", "ping"]
      start_period: 0s
      start_interval: 0s
      interval: 30s
      timeout: 5s
      retries: 3

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.arm
    container_name: celery-worker
    command:
      [
        "/bin/bash",
        "-c",
        "celery -A celery_app.celery_app worker --loglevel=info -E -Q llm,db --concurrency=1 --prefetch-multiplier=1",
      ]
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT}
      - CELERY_BROKER_HOST=redis-celery
      - CELERY_BROKER_PORT=${CELERY_BROKER_PORT}
      - DB_HOST=db
      - DB_PORT=${DB_PORT}
      - PYTHONPATH=/app/src
      - PYTHONMULTIPROCESSING_START_METHOD=spawn
      - TOKENIZERS_PARALLELISM=false
      - OMP_NUM_THREADS=1
      - HF_TOKEN=${HF_TOKEN}
      - HF_HOME=/app/hf_cache
      - HF_HUB_CACHE=/app/hf_cache
      - TRANSFORMERS_CACHE=/app/hf_cache
      - MODEL_CACHE_DIR=/app/hf_cache
      - CELERY_WORKER=true
    volumes:
      - .:/app
      - ${DATA_DIR}/hf:/app/hf_cache
    depends_on:
      redis-celery:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "celery -A celery_app.celery_app status",
        ]
      start_period: 0s
      interval: 60s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: Dockerfile.arm
    container_name: backend
    command:
      [
        "/bin/bash",
        "-c",
        "python /app/src/main.py",
      ]
    expose:
      - ${SERVER_PORT}
    ports:
      - "${SERVER_PORT}:8008"
    volumes:
      - .:/app
      - ${DATA_DIR}/hf:/app/hf_cache
    environment:
      - SERVER_PORT=${SERVER_PORT}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT}
      - CELERY_BROKER_HOST=redis-celery
      - CELERY_BROKER_PORT=${CELERY_BROKER_PORT}
      - DB_HOST=db
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - WEBSITE_HOST=website
      - WEBSITE_PORT=${WEBSITE_PORT}
      - PYTHONPATH=/app/src
      - HF_TOKEN=${HF_TOKEN}
      - HF_HOME=/app/hf_cache
      - HF_HUB_CACHE=/app/hf_cache
      - TRANSFORMERS_CACHE=/app/hf_cache
      - MODEL_CACHE_DIR=/app/hf_cache
      - PRELOAD_MODELS=${PRELOAD_MODELS}
      # Agent subsystem (ACP) upstream provider config
      - AGENT_UPSTREAM_BASE_URL=${AGENT_UPSTREAM_BASE_URL}
      - AGENT_UPSTREAM_API_KEY=${AGENT_UPSTREAM_API_KEY}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - AGENT_REASONING_EFFORT=${AGENT_REASONING_EFFORT}
    # Lets AGENT_UPSTREAM_BASE_URL=http://host.docker.internal:11434/v1 reach an
    # Ollama instance running on the host from inside this container.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "http://127.0.0.1:8008/api/ping",
        ]
      start_period: 0s
      interval: 60s
      timeout: 5s
      retries: 3

  website:
    image: node:18
    container_name: website
    working_dir: /website
    command: bash -c "npm install && npm start -- --port ${WEBSITE_PORT}"
    expose:
      - ${WEBSITE_PORT}
    ports:
      - "${WEBSITE_PORT}:${WEBSITE_PORT}"
    volumes:
      - ./src/website:/website
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:${WEBSITE_PORT}"]
      start_period: 0s
      interval: 60s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.25
    container_name: nginx
    ports:
      - "8000:8000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      website:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      start_period: 0s
      interval: 60s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR}/postgres
  pgadmin_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR}/pgadmin
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR}/redis
  redis_celery_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR}/redis_celery
  website_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR}/website
  celery_worker_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR}/celery_worker