# Local dev stack for machines without an NVIDIA GPU (Apple Silicon / aarch64,
# or any x86_64 box without CUDA). Mirrors docker-compose.yml but:
#   - builds backend/celery-worker from Dockerfile.cpu instead of Dockerfile
#   - drops GPU device reservations, NVIDIA_*/CUDA_* env vars, and the NVML
#     library bind-mounts
#   - defaults PRELOAD_MODELS=false, since loading a multi-GB transformer
#     model on CPU is impractical for local testing and unnecessary for
#     exercising the agent subsystem (which calls an external OpenAI-compatible
#     upstream such as OpenRouter, not a locally loaded model)
#
# Usage: docker compose -f docker-compose.dev-arm.yaml up -d --build

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: postgres
    ports:
      - ${DB_PORT:-2345}:${DB_PORT:-2345}
    expose:
      - ${DB_PORT:-2345}
    volumes:
      - .:/app
      - ./src/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_DB=${DB_NAME:-code4meV2}
      - PGPORT=${DB_PORT:-2345}
    command: ["postgres", "-p", "${DB_PORT:-2345}"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -p ${DB_PORT:-2345}"]
      start_period: 0s
      start_interval: 0s
      interval: 60s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.0
    container_name: redis
    ports:
      - ${REDIS_PORT:-6379}:${REDIS_PORT:-6379}
    expose:
      - ${REDIS_PORT:-6379}
    volumes:
      - .:/app
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--port", "${REDIS_PORT:-6379}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "${REDIS_PORT:-6379}", "ping"]
      start_period: 0s
      start_interval: 0s
      interval: 60s
      timeout: 5s
      retries: 3

  redis-celery:
    image: redis:7.0
    container_name: redis-celery
    ports:
      - ${CELERY_BROKER_PORT:-6380}:${CELERY_BROKER_PORT:-6380}
    expose:
      - ${CELERY_BROKER_PORT:-6380}
    command: ["redis-server", "--port", "${CELERY_BROKER_PORT:-6380}"]
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "${CELERY_BROKER_PORT}", "ping"]
      start_period: 0s
      start_interval: 0s
      interval: 30s
      timeout: 5s
      retries: 3

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    container_name: celery-worker
    env_file:
      - ./.env
    command: [
        "/bin/bash",
        "-c",
        "source activate myenv && celery -A celery_app.celery_app worker --loglevel=info -E -Q llm,db --concurrency=1 --prefetch-multiplier=1",
      ]
    depends_on:
      redis-celery:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT:-6379}
      - CELERY_BROKER_HOST=redis-celery
      - CELERY_BROKER_PORT=${CELERY_BROKER_PORT:-6380}
      - DB_HOST=db
      - DB_PORT=${DB_PORT:-2345}
      - DB_NAME=${DB_NAME:-code4meV2}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - TEST_DATABASE_URL=postgresql://postgres:postgres@test_db:5432/test_db
      - PYTHONPATH=/app/src
      - PYTHONMULTIPROCESSING_START_METHOD=spawn
      - TOKENIZERS_PARALLELISM=false
      - OMP_NUM_THREADS=1
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HOME=/app/hf_cache
      - HF_HUB_CACHE=/app/hf_cache
      - TRANSFORMERS_CACHE=/app/hf_cache
      - MODEL_CACHE_DIR=/app/hf_cache
      - CELERY_WORKER=true
      - PRELOAD_MODELS=false
    volumes:
      - .:/app
      - ${DATA_DIR:-./data}/hf:/app/hf_cache
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "source activate myenv && celery -A celery_app.celery_app status --timeout=5",
        ]
      start_period: 30s
      interval: 60s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    container_name: backend
    env_file:
      - ./.env
    command: ["/bin/bash", "-c", "source activate myenv && python /app/src/main.py"]
    expose:
      - ${SERVER_PORT:-8008}
    ports:
      - "${SERVER_PORT:-8008}:8008"
    volumes:
      - .:/app
      - ${DATA_DIR:-./data}/hf:/app/hf_cache
    environment:
      - SERVER_PORT=${SERVER_PORT:-8008}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT:-6379}
      - CELERY_BROKER_HOST=redis-celery
      - CELERY_BROKER_PORT=${CELERY_BROKER_PORT:-6380}
      - DB_HOST=db
      - DB_PORT=${DB_PORT:-2345}
      - DB_NAME=${DB_NAME:-code4meV2}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - WEBSITE_HOST=website
      - WEBSITE_PORT=${WEBSITE_PORT:-3000}
      - PYTHONPATH=/app/src
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HOME=/app/hf_cache
      - HF_HUB_CACHE=/app/hf_cache
      - TRANSFORMERS_CACHE=/app/hf_cache
      - MODEL_CACHE_DIR=/app/hf_cache
      - PRELOAD_MODELS=false
      # Agent subsystem (ACP) upstream provider config, see .env.example
      - AGENT_UPSTREAM_BASE_URL=${AGENT_UPSTREAM_BASE_URL:-http://host.docker.internal:11434/v1}
      - AGENT_UPSTREAM_API_KEY=${AGENT_UPSTREAM_API_KEY:-}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - AGENT_REASONING_EFFORT=${AGENT_REASONING_EFFORT:-}
    # Lets AGENT_UPSTREAM_BASE_URL=http://host.docker.internal:11434/v1 reach an
    # Ollama instance running on the host from inside this container.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://127.0.0.1:8008/api/ping"]
      start_period: 0s
      interval: 60s
      timeout: 5s
      retries: 3

  website:
    image: node:18
    container_name: website
    working_dir: /website
    command: bash -c "npm install && npm start -- --port ${WEBSITE_PORT:-3000}"
    expose:
      - ${WEBSITE_PORT:-3000}
    ports:
      - "${WEBSITE_PORT:-3000}:${WEBSITE_PORT:-3000}"
    volumes:
      - ./src/website:/website
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:${WEBSITE_PORT:-3000}"]
      start_period: 0s
      interval: 60s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.25
    container_name: nginx
    ports:
      - "8000:8000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      website:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      start_period: 0s
      interval: 60s
      timeout: 5s
      retries: 3

  test_db:
    profiles: ["test"]
    image: pgvector/pgvector:pg16
    container_name: postgres_test
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=test_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d test_db"]
      interval: 2s
      timeout: 5s
      retries: 10
