[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "code4me2-agent"
version = "0.1.0"
description = "Code4Me ACP agent runtime"
requires-python = ">=3.10"
dependencies = [
    # Pre-1.0 SDK: allow bugfix releases in the 0.12 series. Compatibility is
    # covered by the ACP runtime tests; minor bumps need a re-run, not a migration.
    "agent-client-protocol~=0.12.1",
    # ACP requires agents to support client-supplied stdio MCP servers.
    "mcp==2.2.0",
    "openai>=1.0,<2",
]

[project.scripts]
code4me2-agent = "code4me2_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["code4me2_agent*"]

[tool.ruff]
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "Q", "I", "TCH"]
ignore = ["E203", "E402", "E501", "F841", "F401", "F811"]
