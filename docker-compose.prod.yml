# Production stack for the Code4Me research platform (production-readiness
# review P0-2: B-01, B-03, B-04, B-05, B-06, B-07, B-08, B-11).
#
#   docker compose --env-file .env -f docker-compose.prod.yml config      # check
#   docker compose --env-file .env -f docker-compose.prod.yml up -d --build
#
# Differences from docker-compose.yml (the GPU/dev stack):
#   - CPU images (Dockerfile.cpu); no NVIDIA reservations, no Hugging Face login,
#     PRELOAD_MODELS=false. Classic completion/chat rows are provider-backed.
#   - The application reads `.env` (env_file) and the compose file asserts the
#     secrets that must exist (`${VAR:?...}`), so a missing
#     BOOTSTRAP_SIGNING_SECRET fails at `up`, not at the first participant.
#   - restart policies, bounded json-file logs, health checks that touch the
#     database and Redis, and a one-shot `migrate` job the backend waits for.
#   - No source bind mounts: the image carries the code that was built.
#   - Only nginx (the `website` service) is published. Postgres is bound to
#     127.0.0.1 for backups/psql; Redis and the backend are internal.
#   - Redis persists (AOF) and requires a password; Postgres is dumped nightly by
#     the `backup` service (scripts/ops/backup-postgres.sh).
#   - The website is a static build served by nginx, which also proxies /api/.
#
# TLS terminates in front of `website` (see docs/research-platform/
# PRODUCTION_DEPLOYMENT.md); PUBLIC_ORIGIN is the https:// origin participants use.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

x-backend-environment: &backend-environment
  SERVER_HOST: 0.0.0.0
  SERVER_PORT: "8008"
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: ${DB_NAME:?DB_NAME is required}
  DB_USER: ${DB_USER:?DB_USER is required}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required (redis requirepass)}
  CELERY_BROKER_HOST: redis-celery
  CELERY_BROKER_PORT: "6379"
  PYTHONPATH: /app/src
  PRELOAD_MODELS: "false"
  CLASSIC_MODELS_ENABLED: ${CLASSIC_MODELS_ENABLED:-true}
  HF_HOME: /app/hf_cache
  HF_HUB_CACHE: /app/hf_cache
  TRANSFORMERS_CACHE: /app/hf_cache
  MODEL_CACHE_DIR: /app/hf_cache
  BOOTSTRAP_SIGNING_SECRET: ${BOOTSTRAP_SIGNING_SECRET:?BOOTSTRAP_SIGNING_SECRET is required (research bootstrap/capability HMAC)}
  # Participants reach the API through the website/nginx container only, so
  # its X-Forwarded-For is trusted and rate limits key on the real client.
  FORWARDED_ALLOW_IPS: "*"
  COOKIE_SECURE: "true"
  CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required (https origin participants use)}
  WEBSITE_HOST: website
  WEBSITE_PORT: "80"

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    logging: *default-logging
    shm_size: 256m
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    volumes:
      - ./src/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7.2
    restart: unless-stopped
    logging: *default-logging
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - ./redis.prod.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5

  redis-celery:
    image: redis:7.2
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes", "--dir", "/data"]
    volumes:
      - redis_celery_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5

  # One-shot schema job: brings the database to the code's Alembic head (and
  # initializes a fresh database) before the API starts. A failure stops the
  # deployment here; the previous backend, if any, keeps serving.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    image: code4me2-server-backend:prod
    restart: "no"
    logging: *default-logging
    env_file:
      - ./.env
    environment:
      <<: *backend-environment
    command:
      - /bin/bash
      - -c
      - source activate myenv && python src/database/migration/migration_manager.py migrate
    depends_on:
      db:
        condition: service_healthy

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    image: code4me2-server-backend:prod
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ./.env
    environment:
      <<: *backend-environment
      CELERY_WORKER: "true"
      PYTHONMULTIPROCESSING_START_METHOD: spawn
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "1"
    command:
      - /bin/bash
      - -c
      - source activate myenv && celery -A celery_app.celery_app worker --loglevel=info -E -Q llm,db --concurrency=1 --prefetch-multiplier=1
    volumes:
      - hf_cache:/app/hf_cache
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis-celery:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "source activate myenv && celery -A celery_app.celery_app status --timeout=5"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2g

  backend:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    image: code4me2-server-backend:prod
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ./.env
    environment:
      <<: *backend-environment
      CODE4ME_WEB_WORKERS: ${CODE4ME_WEB_WORKERS:-2}
    command: ["/bin/bash", "-c", "source activate myenv && python /app/src/main.py"]
    expose:
      - "8008"
    volumes:
      - hf_cache:/app/hf_cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # The API must come up even if the classic worker is unhealthy: the
      # research plane does not depend on it.
      celery-worker:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/conda/envs/myenv/bin/python -c "import urllib.request as u;
          r=u.urlopen('http://127.0.0.1:8008/api/health', timeout=5);
          exit(0 if r.status == 200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2g

  # Static website + edge proxy (nginx). TLS terminates in front of it, or
  # replace nginx.prod.conf with a TLS variant (nginx.prod.tls.conf.example).
  website:
    build:
      context: .
      dockerfile: src/website/Dockerfile
      args:
        REACT_APP_BACKEND_HOST: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
        REACT_APP_BACKEND_PORT: ""
        REACT_APP_GOOGLE_CLIENT_ID: ${REACT_APP_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_started

  # Nightly pg_dump into ${BACKUP_DIR} (default ./backups), pruned after
  # BACKUP_RETENTION_DAYS, optionally copied off-host by BACKUP_OFFHOST_CMD.
  backup:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    logging: *default-logging
    entrypoint: ["/bin/bash", "/ops/backup-postgres.sh", "--loop"]
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${DB_USER:?DB_USER is required}
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      PGDATABASE: ${DB_NAME:?DB_NAME is required}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_OFFHOST_CMD: ${BACKUP_OFFHOST_CMD:-}
    volumes:
      - ./scripts/ops:/ops:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  redis_celery_data:
  hf_cache:
