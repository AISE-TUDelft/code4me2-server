# Production Redis for auth/session tokens and ACP grants (production-readiness B-05).
#
# Everything that keeps a participant signed in and an agent authorized lives in
# this instance, so it must survive a container restart: AOF with a per-second
# fsync on the `redis_data` volume. The password is passed on the command line by
# docker-compose.prod.yml (`--requirepass "$REDIS_PASSWORD"`) so this file holds
# no secret. Keep `notify-keyspace-events Ex`: the backend subscribes to key
# expiry events to end sessions.
appendonly yes
appendfsync everysec
save 900 1
save 300 100
dir /data
notify-keyspace-events Ex
maxmemory-policy noeviction
protected-mode yes
