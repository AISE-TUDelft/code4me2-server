name: E2E harness

# The harness lives in code4me2-server/e2e but drives both repositories, so this
# workflow checks the plugin out as a sibling and points the harness at the
# workspace with CODE4ME_E2E_WORKSPACE.
#
# Layers:
#   backend  - 17 HTTP workflow steps against the disposable Compose stack
#   browser  - 37 headless Chromium website checks + persisted read models
#   plugin   - Kotlin IntelliJ fixture + HTTP workflow
#   agents   - real Goose/Codex ACP probes (needs a host Goose; not offered here)
#   all      - every layer (needs a graphical runner)
#
# `test` provisions missing prerequisites itself (e.g. e2e/.venv for the native
# agent build); the explicit image/Playwright steps below just keep CI fast and
# its Playwright interpreter explicit.
#
# Only backend/browser are offered here because GitHub-hosted runners have no
# display. Run plugin/all on a self-hosted graphical runner (or locally with
# ./code4me2-server/e2e/test).

on:
  workflow_dispatch:
    inputs:
      layer:
        description: Harness layer to run
        type: choice
        options:
          - backend
          - browser
        default: backend
  push:
    paths:
      - e2e/**
      - .github/workflows/e2e.yml

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harness-tests:
    name: Harness unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: code4me2-server
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Harness regression tests (no Docker or IDE)
        working-directory: code4me2-server/e2e
        run: python -m unittest discover -s tests -v

  layer:
    name: ${{ inputs.layer || 'backend' }} layer
    runs-on: ubuntu-latest
    needs: harness-tests
    steps:
      - uses: actions/checkout@v4
        with:
          path: code4me2-server
      - name: Check out the plugin as a workspace sibling
        uses: actions/checkout@v4
        with:
          repository: AISE-TUDelft/code4me2
          path: code4me2
          # Public repositories work with the default token; private ones need a
          # PLUGIN_CHECKOUT_TOKEN repository secret.
          token: ${{ secrets.PLUGIN_CHECKOUT_TOKEN != '' && secrets.PLUGIN_CHECKOUT_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        if: ${{ inputs.layer == 'browser' }}
        with:
          node-version: "22"
      - name: Build the disposable backend image
        run: docker build -f code4me2-server/Dockerfile.cpu -t code4me2-server-backend:latest code4me2-server
      - name: Install Playwright for the browser layer
        if: ${{ inputs.layer == 'browser' }}
        run: |
          python -m venv "$RUNNER_TEMP/browser-venv"
          "$RUNNER_TEMP/browser-venv/bin/python" -m pip install --quiet playwright
          "$RUNNER_TEMP/browser-venv/bin/python" -m playwright install --with-deps chromium
      - name: Run the harness layer
        working-directory: code4me2-server/e2e
        env:
          CODE4ME_E2E_WORKSPACE: ${{ github.workspace }}
          CODE4ME_E2E_BROWSER_PYTHON: ${{ inputs.layer == 'browser' && format('{0}/browser-venv/bin/python', runner.temp) || '' }}
        run: python -m code4me_e2e test --layer ${{ inputs.layer || 'backend' }} --json
